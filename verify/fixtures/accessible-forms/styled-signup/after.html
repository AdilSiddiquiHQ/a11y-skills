<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create your account</title>
<style>
  body { margin:0; padding:28px 20px; background:#f6f8fa; color:#1f2328;
         font:15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .card { max-width:360px; margin:0 auto; background:#fff; border:1px solid #d0d7de;
          border-radius:8px; padding:24px; }
  h1 { font-size:19px; margin:0 0 18px; }
  label { display:block; font-weight:600; font-size:13px; margin:14px 0 6px; color:#1f2328; }
  input { width:100%; box-sizing:border-box; padding:8px 10px; font-size:14px;
          border:1px solid #d0d7de; border-radius:6px; }
  input::placeholder { color:#656d76; }
  .hint { margin:6px 0 0; font-size:12px; color:#57606a; }
  button { margin-top:20px; width:100%; padding:9px 16px; font-size:14px; font-weight:600;
           color:#fff; background:#157347; border:0; border-radius:6px; }
</style>
</head>
<body>
  <main class="card">
    <h1>Create your account</h1>
    <form>
      <label for="email">Email address</label>
      <input id="email" type="email" name="email" autocomplete="email" placeholder="you@company.com">
      <label for="password">Password</label>
      <input id="password" type="password" name="password" autocomplete="new-password">
      <p class="hint">At least 12 characters.</p>
      <button type="submit">Create account</button>
    </form>
  </main>
</body>
</html>

    <h1>Order 10428</h1>
    <p>Your order ships in two parcels, one from Bristol and one from Leeds.</p>

    <!-- Bold and enlarged, so they look like headings and are not ones. axe's

    <p>21 Example Street, Bristol, BS1 4XX, United Kingdom</p>

    <p style="font-size: 1.5rem; font-weight: 700">Billing</p>
    <p>Same address as shipping, so no separate invoice is needed.</p>
  </main>

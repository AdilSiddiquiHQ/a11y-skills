<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Release checklist</title></head>
<body>
  <main>
    <h1>Release checklist</h1>

    <ul class="steps" style="list-style: none">
      <div class="step">Run the test suite</div>
      <div class="step">Tag the release</div>
    </ul>

    <div class="notes">
      <li>Check the changelog</li>
      <li>Announce in the channel</li>
    </div>

    <dl class="meta">
      <span class="term">Owner</span>
      <span class="value">Release crew</span>
    </dl>
    <dt>Freeze window</dt>
    <dd>Friday 17:00</dd>
  </main>
</body>
</html>

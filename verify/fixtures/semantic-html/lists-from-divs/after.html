<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Release checklist</title></head>
<body>
  <main>
    <h1>Release checklist</h1>

    <!-- role="list" because list-style:none removes the list semantics in Safari -->
    <ul class="steps" role="list" style="list-style: none">
      <li>Run the test suite</li>
      <li>Tag the release</li>
    </ul>

    <h2>Also before you ship</h2>
    <ul class="notes">
      <li>Check the changelog</li>
      <li>Announce in the channel</li>
    </ul>

    <h2>Details</h2>
    <dl class="meta">
      <dt>Owner</dt>
      <dd>Release crew</dd>
      <dt>Freeze window</dt>
      <dd>Friday 17:00</dd>
    </dl>
  </main>
</body>
</html>
